spring.application.name=tax

# ==============================================================
# Database Configuration (支援環境變數覆寫，未設定時使用開發環境預設值)
# ==============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.2.79:33061/fox_refund?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:fox}
spring.datasource.password=${DB_PASSWORD:Foxgogo2018}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 啟動時自動更新資料表結構 (測試環境用 update，正式環境建議透過環境變數設為 validate 或 none)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# 顯示 SQL 語句 (除錯用，正式環境可透過環境變數設為 false)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# JWT Configuration (對應 JwtTokenProvider)
# ==============================================================
jwt.secret=${JWT_SECRET:9a2f8c4e6b0d71f3e8b9c2d4e6f8a0c2e4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================================
# Open API (Swagger) Configuration
# ==============================================================
springdoc.packages-to-scan=com.fox.tax

