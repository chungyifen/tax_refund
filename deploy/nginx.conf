# ==============================================================================
# 進口退稅核銷管理系統 - 容器內 Nginx 設定檔
# 應用掛載於 /tax_refund/ 子路徑，對應 192.168.2.200 主機 Nginx 的：
#   location /tax_refund/ { proxy_pass http://127.0.0.1:9090; }
# 直連 http://192.168.2.200:9090/ 也會自動 302 導向 /tax_refund/
# ==============================================================================
server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # 允許上傳較大的進出口報單 Excel 檔案 (最大 50MB)
    client_max_body_size 50m;

    # 開啟 Gzip 壓縮加速前端資源與 API JSON 傳輸
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 根路徑自動導向 /tax_refund/
    location = / {
        return 302 /tax_refund/;
    }

    # 子路徑後端 API 反向代理 (/tax_refund/api/ -> backend:8080/api/)
    location /tax_refund/api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 相容直接呼叫 /api/
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 前端 SPA 靜態資源與 Vue Router History 模式支援 (/tax_refund/)
    location /tax_refund/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /tax_refund/index.html;
    }
}
