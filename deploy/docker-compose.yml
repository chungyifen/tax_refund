# ==============================================================================
# 進口退稅核銷管理系統 - Docker Compose 部署設定檔
# 部署目標主機：192.168.2.200 (/home/gogoffcc/tax-refund)
# 對外服務網址：http://192.168.2.200:9090
# ==============================================================================
services:
  # 後端 Spring Boot 服務
  backend:
    image: eclipse-temurin:21-jre
    container_name: tax-refund-backend
    working_dir: /app
    volumes:
      - ./tax-api.jar:/app/app.jar:ro
    command: ["java", "-Xms256m", "-Xmx1024m", "-jar", "/app/app.jar"]
    environment:
      TZ: Asia/Taipei
      DB_URL: jdbc:mysql://192.168.2.79:33061/fox_refund?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      DB_USERNAME: fox
      DB_PASSWORD: Foxgogo2018
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
    restart: unless-stopped

  # 前端 Nginx + 反向代理服務
  web:
    image: nginx:alpine
    container_name: tax-refund-web
    ports:
      - "9090:80"
    environment:
      TZ: Asia/Taipei
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
